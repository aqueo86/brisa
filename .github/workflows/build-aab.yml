name: Compilar Brisa Android (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Compilar Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Generar Keystore de firma de lanzamiento
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias brisa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass brisa2026 \
            -keypass brisa2026 \
            -dname "CN=Brisa Finanzas, OU=Mobile, O=Brisa, L=Bogota, ST=Cundinamarca, C=CO"

      - name: Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar Android App Bundle (Release)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Subir archivo AAB para descarga
        uses: actions/upload-artifact@v4
        with:
          name: brisa-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
